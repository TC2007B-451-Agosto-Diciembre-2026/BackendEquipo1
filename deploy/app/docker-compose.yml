name: sentinel-app

services:
  proxy:
    image: miguelgarduno123/sentinel-proxy:${SENTINEL_TAG:-1.0}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
      - admin-web

  backend:
    image: miguelgarduno123/sentinel-backend:${SENTINEL_TAG:-1.0}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Falta DATABASE_URL en .env}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
      NODE_ENV: production
      PORT: "3000"
      TRUST_PROXY: "1"
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-30}
      PUBLIC_RATE_LIMIT: ${PUBLIC_RATE_LIMIT:-600}
      SWAGGER: ${SWAGGER:-1}
      SWAGGER_SERVER_URL: /api
    volumes:
      - evidence_data:/app/uploads

  admin-web:
    image: miguelgarduno123/sentinel-admin-web:${SENTINEL_TAG:-1.0}
    restart: unless-stopped

volumes:
  evidence_data:
