name: sentinel-app

services:
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - admin-web

  backend:
    build: ../..
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      TRUST_PROXY: "1"
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-30}
      PUBLIC_RATE_LIMIT: ${PUBLIC_RATE_LIMIT:-600}
      SWAGGER: ${SWAGGER:-1}
      SWAGGER_SERVER_URL: /api
    volumes:
      - evidence_data:/app/uploads

  admin-web:
    build:
      context: ${FRONTEND_PATH:-../../../FrontendEquipo1}
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://172.16.64.2/api}
    restart: unless-stopped

volumes:
  evidence_data:
